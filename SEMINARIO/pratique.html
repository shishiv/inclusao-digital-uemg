<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratique | Inclusão Digital UEMG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-uemg: #4A6FA5;
            --azul-escuro: #2C4A6E;
            --azul-claro: #6B8FC5;
            --azul-bg: #E8F1F8;
            --verde: #7FB069;
            --verde-escuro: #5A8A4A;
            --verde-claro: #9FC78F;
            --verde-bg: #E8F5E1;
            --amarelo: #F3DE8A;
            --amarelo-escuro: #D4C06A;
            --amarelo-bg: #FFF9E6;
            --vermelho-uemg: #C8102E;
            --vermelho-bg: #FDEAEA;
            --branco: #FFFFFF;
            --cinza-bg: #F5F7FA;
            --cinza-claro: #E5E9EF;
            --cinza-medio: #9AA5B4;
            --cinza-texto: #555555;
            --cinza-escuro: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: var(--cinza-texto);
            line-height: 1.7;
            background: var(--cinza-bg);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul-uemg) 100%);
            color: var(--branco);
            padding: 40px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: var(--verde);
            opacity: 0.1;
            border-radius: 50%;
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .header h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .header .slogan {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: var(--verde-claro);
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Progress Section */
        .progress-section {
            background: var(--branco);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--azul-escuro);
            font-size: 1.1rem;
        }

        .progress-score {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--verde);
            font-size: 1.2rem;
        }

        .progress-bar {
            background: var(--cinza-claro);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--verde) 0%, var(--verde-claro) 100%);
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* Lesson Selector */
        .lesson-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .lesson-btn {
            padding: 12px 20px;
            border: 2px solid var(--cinza-claro);
            border-radius: 12px;
            background: var(--branco);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--cinza-texto);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lesson-btn:hover {
            border-color: var(--azul-uemg);
            color: var(--azul-uemg);
        }

        .lesson-btn.active {
            background: var(--azul-uemg);
            border-color: var(--azul-uemg);
            color: var(--branco);
        }

        .lesson-btn .emoji {
            font-size: 1.2rem;
        }

        /* Quiz Card */
        .quiz-card {
            background: var(--branco);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 25px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.06);
        }

        .quiz-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .quiz-number {
            background: var(--azul-uemg);
            color: var(--branco);
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quiz-meta {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--cinza-medio);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-question {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--azul-escuro);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px 25px;
            border: 2px solid var(--cinza-claro);
            border-radius: 12px;
            background: var(--branco);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--azul-uemg);
            background: var(--azul-bg);
        }

        .option-btn.selected {
            border-color: var(--azul-uemg);
            background: var(--azul-bg);
        }

        .option-btn.correct {
            border-color: var(--verde);
            background: var(--verde-bg);
        }

        .option-btn.incorrect {
            border-color: var(--vermelho-uemg);
            background: var(--vermelho-bg);
        }

        .option-btn.disabled {
            cursor: default;
        }

        .option-letter {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--cinza-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--azul-escuro);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-btn.selected .option-letter {
            background: var(--azul-uemg);
            color: var(--branco);
        }

        .option-btn.correct .option-letter {
            background: var(--verde);
            color: var(--branco);
        }

        .option-btn.incorrect .option-letter {
            background: var(--vermelho-uemg);
            color: var(--branco);
        }

        .option-text {
            font-size: 1.05rem;
            color: var(--cinza-escuro);
        }

        /* Feedback */
        .feedback {
            margin-top: 25px;
            padding: 20px 25px;
            border-radius: 12px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .feedback.correct {
            background: var(--verde-bg);
            border-left: 4px solid var(--verde);
        }

        .feedback.incorrect {
            background: var(--amarelo-bg);
            border-left: 4px solid var(--amarelo-escuro);
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .feedback-icon {
            font-size: 1.5rem;
        }

        .feedback-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--verde-escuro);
        }

        .feedback.incorrect .feedback-title {
            color: var(--amarelo-escuro);
        }

        .feedback-text {
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Navigation Buttons */
        .quiz-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px solid var(--cinza-claro);
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn.primary {
            background: var(--verde);
            color: var(--branco);
        }

        .nav-btn.primary:hover {
            background: var(--verde-escuro);
        }

        .nav-btn.secondary {
            background: var(--azul-bg);
            color: var(--azul-uemg);
        }

        .nav-btn.secondary:hover {
            background: var(--azul-uemg);
            color: var(--branco);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Completion Card */
        .completion-card {
            background: linear-gradient(135deg, var(--verde-bg) 0%, var(--azul-bg) 100%);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            display: none;
        }

        .completion-card.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .completion-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .completion-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            color: var(--azul-escuro);
            margin-bottom: 10px;
        }

        .completion-subtitle {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: var(--verde);
            margin-bottom: 25px;
        }

        .completion-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--azul-uemg);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--cinza-texto);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--cinza-medio);
            font-size: 0.9rem;
        }

        .footer a {
            color: var(--azul-uemg);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .quiz-card {
                padding: 25px 20px;
            }

            .quiz-question {
                font-size: 1.2rem;
            }

            .option-btn {
                padding: 15px 18px;
            }

            .lesson-selector {
                justify-content: center;
            }

            .completion-stats {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

    </main>

    <!-- Footer -->

        <p>Programa de Inclusão Digital 60+ • <a href="/">UEMG Frutal</a></p>

        // State
        let currentLesson = '1';
        let currentQuestion = 0;
        let correctAnswers = 0;
        let answeredQuestions = [];

        // DOM Elements
        const quizContainer = document.getElementById('quiz-container');
        const completionCard = document.getElementById('completion-card');
        const scoreDisplay = document.getElementById('score-display');
        const progressFill = document.getElementById('progress-fill');
        const lessonButtons = document.querySelectorAll('.lesson-btn');

        // Initialize
        function init() {
            lessonButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentLesson = btn.dataset.lesson;
                    lessonButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    resetQuiz();
                });
            });
            renderQuestion();
        }

        // Reset Quiz
        function resetQuiz() {
            currentQuestion = 0;
            correctAnswers = 0;
            answeredQuestions = [];
            completionCard.classList.remove('show');
            renderQuestion();
            updateProgress();
        }

        // Render Question
        function renderQuestion() {
            const questions = quizData[currentLesson].questions;
            
            if (currentQuestion >= questions.length) {
                showCompletion();
                return;
            }

            const q = questions[currentQuestion];
            const letters = ['A', 'B', 'C', 'D'];

            quizContainer.innerHTML = `
                <div class="quiz-card">
                    <div class="quiz-header">
                        <div class="quiz-number">${currentQuestion + 1}</div>
                        <span class="quiz-meta">Pergunta ${currentQuestion + 1} de ${questions.length}</span>
                    </div>
                    <h2 class="quiz-question">${q.question}</h2>
                    <div class="options-list">
                        ${q.options.map((opt, i) => `
                            <button class="option-btn" data-index="${i}">
                                <span class="option-letter">${letters[i]}</span>
                                <span class="option-text">${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="quiz-nav">
                        <button class="nav-btn secondary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
                            ← Anterior
                        </button>
                        <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()" style="display: none;">
                            Próxima →
                        </button>
                    </div>
                </div>
            `;

            // Add click listeners to options
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => selectOption(parseInt(btn.dataset.index)));
            });
        }

        // Select Option
        function selectOption(index) {
            const questions = quizData[currentLesson].questions;
            const q = questions[currentQuestion];
            const isCorrect = index === q.correct;

            // Disable all buttons
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.add('disabled');
                const idx = parseInt(btn.dataset.index);
                if (idx === q.correct) {
                    btn.classList.add('correct');
                } else if (idx === index && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });

            // Show feedback
            const feedback = document.getElementById('feedback');
            feedback.className = `feedback show ${isCorrect ? 'correct' : 'incorrect'}`;
            feedback.innerHTML = `
                <div class="feedback-header">
                    <span class="feedback-icon">${isCorrect ? '🎉' : '💡'}</span>
                    <span class="feedback-title">${isCorrect ? 'Muito bem!' : 'Quase lá!'}</span>
                </div>
                <p class="feedback-text">${q.explanation}</p>
            `;

            // Update score
            if (!answeredQuestions.includes(currentQuestion)) {
                answeredQuestions.push(currentQuestion);
                if (isCorrect) {
                    correctAnswers++;
                }
                updateProgress();
            }

            // Show next button
            document.getElementById('next-btn').style.display = 'inline-flex';
        }

        // Update Progress
        function updateProgress() {
            const questions = quizData[currentLesson].questions;
            const total = questions.length;
            const progress = (answeredQuestions.length / total) * 100;
            
            progressFill.style.width = `${progress}%`;
            scoreDisplay.textContent = `${correctAnswers} de ${answeredQuestions.length} corretas`;
        }

        // Next Question
        function nextQuestion() {
            currentQuestion++;
            renderQuestion();
        }

        // Previous Question
        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        // Show Completion
        function showCompletion() {
            quizContainer.innerHTML = '';
            completionCard.classList.add('show');
            document.getElementById('final-correct').textContent = correctAnswers;
            document.getElementById('final-total').textContent = quizData[currentLesson].questions.length;
        }

        // Restart Quiz
        function restartQuiz() {
            resetQuiz();
        }

        // Start
        init();
    </script>
